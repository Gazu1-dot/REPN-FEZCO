<svg xmlns="http://www.w3.org/2000/svg" width="460" height="700" viewBox="0 0 460 700">
 <title>Additional operating information: references 8 to 14</title>
 <desc>8 required pump head, a pump duty rather than an installation depth; 9 pump installation depth, with the reference point to be stated; 10 casing inside diameter; 11 fluid density; 12 free gas at the pump intake; 13 suspended solids; 14 existing power supply or variable speed drive. Schematic only, not to scale.</desc>
